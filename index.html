<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perry's Hairline – Hair Store</title>
    <style>
      #root-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #fdf0f5;
        font-family: Georgia, serif;
        gap: 16px;
      }
      #root-loader .brand {
        font-size: 22px;
        font-weight: 900;
        color: #2A1020;
        letter-spacing: 1px;
      }
      #root-loader .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #f0d0df;
        border-top-color: #C9973A;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root" aria-live="polite" aria-label="Perry's Hairline store">
      <!-- Branded loader shown until React hydrates -->
      <div id="root-loader" role="status" aria-label="Loading Perry's Hairline">
        <div class="brand">✦ Perry's Hairline</div>
        <div class="spinner"></div>
      </div>
    </div>
    <noscript>
      <style>
        body { font-family: sans-serif; margin: 0; background: #fdf0f5; color: #2A1020; }
        .ns { max-width: 560px; margin: 60px auto; padding: 0 24px; }
        h1 { font-family: Georgia, serif; font-size: 26px; margin-bottom: 12px; }
        p { color: #444; line-height: 1.7; margin-bottom: 12px; }
        a { color: #C9973A; font-weight: 700; }
        details { margin: 16px 0; border: 1px solid #f0d0df; border-radius: 8px; padding: 12px 16px; }
        summary { cursor: pointer; font-weight: 700; color: #2A1020; }
        ul { padding-left: 20px; line-height: 2; color: #444; }
      </style>
      <main class="ns">
        <h1>Perry's Hairline</h1>
        <p>Our store needs JavaScript to load products and process orders. JavaScript is currently disabled in your browser.</p>
        <details>
          <summary>How to enable JavaScript</summary>
          <ul>
            <li><strong>Chrome / Edge:</strong> Settings → Privacy &amp; Security → Site Settings → JavaScript → Allowed</li>
            <li><strong>Firefox:</strong> Type <code>about:config</code> in the address bar → search <code>javascript.enabled</code> → set to <em>true</em></li>
            <li><strong>Safari:</strong> Preferences → Security → tick "Enable JavaScript"</li>
          </ul>
        </details>
        <p>Prefer to order directly? Reach us here:</p>
        <ul style="list-style:none;padding:0;line-height:2.2">
          <li><a href="https://api.whatsapp.com/send/?phone=2349025373225">WhatsApp: +234 902 537 3225</a></li>
          <li><a href="https://www.instagram.com/perrys_hairline">Instagram: @perrys_hairline</a></li>
          <li><a href="https://www.tiktok.com/@perrys_hairline">TikTok: @perrys_hairline</a></li>
        </ul>
        <p style="font-size:13px;color:#777;margin-top:24px">Perry's Hairline — Premium Human Hair, Lagos Nigeria</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
